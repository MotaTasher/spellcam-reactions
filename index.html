<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎆</text></svg>">
<title>SpellCam</title>
<style>
:root {
  --bg: #0d0d12;
  --panel: #17171f;
  --line: #2a2a36;
  --text: #f2f2f7;
  --muted: #8e8e9c;
  --accent: #ff3b5c;
  --on: #ffd23f;
  --stage: min(78vw, 56vh, 520px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(circle at 50% 30%, #1b1b27 0%, var(--bg) 60%);
  color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  overflow-x: hidden;
}
h1 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 4px 0 14px; letter-spacing: .02em; }
.stage { position: relative; width: var(--stage); height: var(--stage); flex: none; }
#out {
  width: 100%; height: 100%;
  border-radius: 50%;
  display: block;
  background: #000;
  box-shadow: 0 20px 60px rgba(0,0,0,.55);
}
#cam { display: none; }
#ring { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); transform: rotate(-90deg); pointer-events: none; }
#ring circle { fill: none; stroke-width: 4; }
#ring .bg { stroke: transparent; }
#ring .p { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .1s linear; }
body.rec #ring .bg { stroke: rgba(255,255,255,.08); }
body:not(.rec) #ring .p { opacity: 0; }
.controls { display: flex; align-items: center; gap: 18px; margin: 18px 0 6px; }
#recbtn {
  -webkit-appearance: none; appearance: none; outline: none; -webkit-tap-highlight-color: transparent;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  width: 68px; height: 68px; border-radius: 50%; overflow: hidden; box-sizing: border-box;
  border: 4px solid #fff; background: transparent; background-clip: padding-box; padding: 0; margin: 0; cursor: pointer;
  display: grid; place-items: center; box-shadow: none;
}
#recbtn:focus, #recbtn:focus-visible, #recbtn:active { outline: none; background: transparent; box-shadow: none; }
#recbtn::after {
  content: ""; width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); transition: all .2s ease;
}
body.rec #recbtn::after { width: 26px; height: 26px; border-radius: 7px; }
.side { width: 48px; display: grid; place-items: center; }
#flip {
  -webkit-appearance: none; appearance: none; outline: none; -webkit-tap-highlight-color: transparent;
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); cursor: pointer; padding: 0;
  display: grid; place-items: center;
}
#flip svg { width: 24px; height: 24px; }
#flip[hidden] { display: none; }
#time { width: 48px; font-variant-numeric: tabular-nums; color: var(--muted); text-align: center; }
body.rec #time { color: var(--accent); }
#status { min-height: 21px; color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 8px; }
#fx {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px;
  width: min(100%, 620px);
}
.fx {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--text);
  padding: 10px 6px 8px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font: inherit;
  transition: transform .08s ease, border-color .2s ease, background .2s ease;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
.fx:active { transform: scale(.94); }
.fx.on { border-color: var(--on); background: #241f12; }
.fx .e { font-size: 26px; line-height: 1.1; }
.fx .n { font-size: 13px; }
.fx kbd {
  position: absolute; top: 5px; right: 7px;
  font: 11px/1 ui-monospace, Menlo, monospace; color: var(--muted);
}
.hint { color: var(--muted); font-size: 12px; margin-top: 12px; text-align: center; }
@media (hover: none) { .fx kbd, .hint { display: none; } }
@media (orientation: landscape) and (max-height: 1000px) and (min-width: 700px) {
  :root { --stage: min(62vh, 46vw, 560px); }
  body {
    display: grid;
    grid-template-columns: auto minmax(260px, 440px);
    grid-template-areas: "title title" "stage fx" "controls fx" "status fx" "hint hint";
    justify-content: center;
    align-content: center;
    column-gap: 40px;
    min-height: 100%;
  }
  h1 { grid-area: title; text-align: center; }
  .stage { grid-area: stage; }
  .controls { grid-area: controls; justify-content: center; }
  #status { grid-area: status; }
  #fx { grid-area: fx; align-self: center; width: 100%; }
  .hint { grid-area: hint; }
}
body.out { padding: 0; background: #000; overflow: hidden; display: block; }
body.out > :not(.stage):not(#cam) { display: none !important; }
body.out .stage { width: 100vmin; height: 100vmin; margin: 0 auto; }
body.out #out { border-radius: 0; box-shadow: none; }
body.out #ring { display: none; }
@media (max-width: 520px) {
  :root { --stage: min(80vw, 46vh, 520px); }
  #fx { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .fx { padding: 7px 2px 6px; border-radius: 12px; }
  .fx .e { font-size: 22px; }
  .fx .n { font-size: 11px; white-space: nowrap; }
  .controls { margin: 12px 0 4px; }
}
#preview {
  position: fixed; inset: 0; background: rgba(5,5,10,.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  padding: 16px; z-index: 10;
}
#preview[hidden] { display: none; }
#saved { color: var(--muted); font-size: 13px; min-height: 18px; text-align: center; }
#preview video { width: var(--stage); height: var(--stage); border-radius: 50%; object-fit: cover; background: #000; }
.row { display: flex; gap: 10px; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 20px; font: 600 15px/1 inherit; cursor: pointer;
  background: var(--panel); color: var(--text); text-decoration: none; font-family: inherit;
}
.btn.primary { background: var(--accent); color: #fff; }
.btn[hidden] { display: none; }
.btn:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<h1>SpellCam</h1>
<div class="stage">
  <canvas id="out"></canvas>
  <svg id="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="48"/><circle class="p" cx="50" cy="50" r="48"/></svg>
</div>
<video id="cam" playsinline muted></video>
<div class="controls">
  <span id="time">0:00</span>
  <button id="recbtn" aria-label="Запись"></button>
  <span class="side"><button id="flip" aria-label="Сменить камеру" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.5-2h5L16 6h1.5A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><path d="M9.2 11.2a3 3 0 0 1 5.3-.9M14.8 14.8a3 3 0 0 1-5.3.9"/><path d="M14.6 8.9v1.5h-1.5M9.4 17.1v-1.5h1.5"/></svg></button></span>
</div>
<div id="status"></div>
<div id="fx"></div>
<div class="hint">Пробел или кнопка: запись; держи кнопку, чтобы писать, пока держишь. Клавиши 1–0 и q–r: эффекты. Можно жать во время записи и по несколько сразу.</div>
<div id="preview" hidden>
  <video playsinline loop controls muted></video>
  <div id="saved"></div>
  <div class="row">
    <button class="btn" id="again">Ещё раз</button>
    <a class="btn" id="save">Скачать</a>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
